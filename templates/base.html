<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Yarnpalette{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="icon" type="image/png" href="{% static 'images/yarnpalette.png' %}">
</head>
<body>
    <nav class="navbar navbar-dark yf-navbar mb-4">
        <div class="container">
            <a class="navbar-brand" href="{% url 'index' %}">
                <img src="{% static 'images/yarnpalette.png' %}" alt="Logo" height="36"> YarnPalette
            </a>
            <div class="d-flex align-items-center gap-3">
                {% if user.is_authenticated %}
                <a href="{% url 'profile' %}" class="nav-link text-white small">★ Favourites</a>
                <a href="{% url 'account_logout' %}" class="nav-link text-white small">Log out</a>
                {% else %}
                <a href="{% url 'account_login' %}" class="nav-link text-white small">Log in</a>
                <a href="{% url 'account_signup' %}" class="btn btn-sm btn-outline-light">Sign up</a>
                {% endif %}
            </div>
        </div>
    </nav>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
