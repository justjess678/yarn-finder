<a href="{{ s.site_url }}" target="_blank" class="source-logo-item" title="{{ s.display_name }}">
    <img src="https://www.google.com/s2/favicons?domain={{ s.site_url }}&sz=64"
         alt="{{ s.display_name }} logo"
         class="source-logo-img">
    <span class="source-logo-name">{{ s.display_name }}</span>
</a>
